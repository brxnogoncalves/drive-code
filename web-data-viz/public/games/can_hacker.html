 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive & Code - CAN Hacker</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

    <div class="header">
        <h1 class="logo-drive-code">Drive <span>&lt;Code/&gt;</span></h1>
        <ul class="navbar">
            <!-- LINKS SÃO COLOCADOS VIA JS -->
        </ul>
    </div>

    <div class="quiz-page">

        <div class="quiz-card">
            <span id="contador_pergunta" class="quiz-tag">CAN Hacker</span>

            <h2 id="pergunta">Carregando desafio...</h2>

            <div class="terminal-can">
                <p>[ECU CONNECTED]</p>
                <p id="mensagem_can">Aguardando mensagem...</p>
            </div>

            <div class="quiz-info">
                <span id="tema_pergunta"></span>
                <span id="pontos_quiz">0 pontos</span>
            </div>

            <div class="opcoes" id="opcoes"></div>

            <div id="resultado_quiz" class="resultado-quiz none"></div>

            <button id="btn_proxima" class="btn-proxima none" onclick="proximaPergunta()">
                Próxima
            </button>
        </div>

    </div>

    <script src="../assets/js/utils.js"></script>
    <script>
        alterarNavBar();

        let perguntas = [
            {
                pergunta: "O que acontece quando você aperta um botão em um carro moderno?",
                mensagem: "RX: botão pressionado",
                opcoes: [
                    "Um módulo eletrônico recebe a informação",
                    "O carro reinicia",
                    "O motor desliga sozinho",
                    "Nada acontece"
                ],
                correta: 0,
                tema: "Módulos"
            },
            {
                pergunta: "Qual dessas áreas faz parte de um carro moderno?",
                mensagem: "SYSTEM: sensores, módulos e software ativos",
                opcoes: [
                    "Programação",
                    "Eletrônica",
                    "Sensores",
                    "Todas as alternativas"
                ],
                correta: 3,
                tema: "Tecnologia automotiva"
            },
            {
                pergunta: "O que a rede CAN faz no veículo?",
                mensagem: "CAN BUS: comunicação entre módulos",
                opcoes: [
                    "Permite comunicação entre módulos",
                    "Aumenta a velocidade do carro",
                    "Controla a pintura",
                    "Liga o rádio"
                ],
                correta: 0,
                tema: "Rede CAN"
            },
            {
                pergunta: "O que um firmware embarcado pode controlar?",
                mensagem: "FW: lendo sensores e executando comandos",
                opcoes: [
                    "Sensores e comandos do veículo",
                    "Somente a multimídia",
                    "Somente o farol",
                    "Apenas o velocímetro"
                ],
                correta: 0,
                tema: "Firmware"
            },
            {
                pergunta: "Qual dessas informações um carro consegue ler em tempo real?",
                mensagem: "OBD: dados atuais do veículo",
                opcoes: [
                    "Rotação do motor",
                    "Velocidade",
                    "Temperatura",
                    "Todas as alternativas"
                ],
                correta: 3,
                tema: "OBD"
            },
            {
                pergunta: "O que é um módulo automotivo?",
                mensagem: "MODULE: ECU detectada",
                opcoes: [
                    "Um computador responsável por funções do carro",
                    "Uma peça da suspensão",
                    "Um tipo de pneu",
                    "Parte do escapamento"
                ],
                correta: 0,
                tema: "ECU"
            },
            {
                pergunta: "Por que carros modernos utilizam eletrônica?",
                mensagem: "SYSTEM: controle eletrônico ativo",
                opcoes: [
                    "Para automatizar funções e trocar informações",
                    "Apenas por estética",
                    "Somente para tocar música",
                    "Para diminuir o tamanho do volante"
                ],
                correta: 0,
                tema: "Eletrônica"
            },
            {
                pergunta: "Qual dessas tecnologias aparece no Drive & Code?",
                mensagem: "DRIVE_CODE: dashboard, XP e games carregados",
                opcoes: [
                    "Dashboard",
                    "Sistema de XP",
                    "Games",
                    "Todas as alternativas"
                ],
                correta: 3,
                tema: "Drive & Code"
            }
        ];

        let perguntaAtual = 0;
        let pontos = 0;
        let respondeu = false;

        carregarPergunta();

        function carregarPergunta() {
            respondeu = false;

            let perguntaObj = perguntas[perguntaAtual];

            pergunta.innerHTML = perguntaObj.pergunta;
            mensagem_can.innerHTML = perguntaObj.mensagem;
            contador_pergunta.innerHTML = "Desafio " + (perguntaAtual + 1) + " de " + perguntas.length;
            tema_pergunta.innerHTML = "Tema: " + perguntaObj.tema;
            pontos_quiz.innerHTML = "Pontos ganhos: " + pontos + " pontos";

            resultado_quiz.classList.add("none");
            btn_proxima.classList.add("none");

            opcoes.innerHTML = "";

            for (let i = 0; i < perguntaObj.opcoes.length; i++) {
                opcoes.innerHTML += `
                    <button class="opcao-btn" onclick="responder(${i})">
                        ${perguntaObj.opcoes[i]}
                    </button>
                `;
            }
        }

        function responder(indice) {
            if (respondeu) return;

            respondeu = true;

            let perguntaObj = perguntas[perguntaAtual];
            let botoesOpcoes = document.querySelectorAll(".opcao-btn");

            if (indice == perguntaObj.correta) {
                pontos += 10;
                botoesOpcoes[indice].classList.add("opcao-correta");

                resultado_quiz.innerHTML = "Diagnóstico correto!";
                resultado_quiz.className = "resultado-quiz resultado-correto";
            } else {
                botoesOpcoes[indice].classList.add("opcao-errada");
                botoesOpcoes[perguntaObj.correta].classList.add("opcao-correta");

                resultado_quiz.innerHTML = "Diagnóstico incorreto!";
                resultado_quiz.className = "resultado-quiz resultado-errado";
            }

            pontos_quiz.innerHTML = "Pontos ganhos: " + pontos + " pontos";
            btn_proxima.classList.remove("none");
        }

        function proximaPergunta() {
            perguntaAtual++;

            if (perguntaAtual < perguntas.length) {
                carregarPergunta();
            } else {
                finalizarGame();
            }
        }

        function finalizarGame() {
            let xpGanho = pontos;

            pergunta.innerHTML = "CAN Hacker finalizado!";
            contador_pergunta.innerHTML = "Resultado final";
            pontos_quiz.innerHTML = pontos + " pontos";
            mensagem_can.innerHTML = "SESSION CLOSED";

            opcoes.innerHTML = `
                <div class="quiz-final">
                    <h3>Você ganhou ${xpGanho} XP!</h3>
                    <p>Seu carro recebeu essa pontuação pelo desafio CAN Hacker.</p>
                    <a href="../games.html" class="btn-jogar">Voltar</a>
                </div>
            `;

            resultado_quiz.classList.add("none");
            btn_proxima.classList.add("none");

            adicionarXP(xpGanho);
        }

        function adicionarXP(xpGanho) {
            fetch("/games/adicionarXP", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    idUsuarioServer: sessionStorage.ID_USUARIO,
                    idGameServer: 4,
                    xpGanhoServer: xpGanho
                })
            })
                .then(function (resposta) {
                    if (resposta.ok) {
                        resposta.json().then(function (json) {
                            sessionStorage.XP_CARRO = json.xp;
                            sessionStorage.NIVEL_CARRO = json.nivel;

                            console.log("XP atualizado:", json);
                        });
                    }
                });
        }
    </script>

</body>

</html>
