<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive & Code - Oficina de Debug</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

    <div class="header">
        <h1 class="logo-drive-code">Drive <span>&lt;Code/&gt;</span></h1>
        <ul class="navbar">
            <!-- LINKS SÃO COLOCADOS VIA JS -->
        </ul>
    </div>

    <div class="quiz-page">

        <div class="quiz-card">
            <span id="contador_pergunta" class="quiz-tag">Oficina de Debug</span>

            <h2 id="pergunta">Carregando desafio...</h2>

            <pre class="codigo-debug"><code id="codigo_debug"></code></pre>

            <div class="quiz-info">
                <span id="tema_pergunta"></span>
                <span id="pontos_quiz">0 pontos</span>
            </div>

            <div class="opcoes" id="opcoes"></div>

            <div id="resultado_quiz" class="resultado-quiz none"></div>

            <button id="btn_proxima" class="btn-proxima none" onclick="proximaPergunta()">
                Próxima
            </button>
        </div>

    </div>

    <script src="../assets/js/utils.js"></script>
    <script>
        alterarNavBar();

        let perguntas = [
            {
                pergunta: "Qual é o erro nesse código?",
                codigo: "let idade = 18;\n\nif idade >= 18 {\n    console.log('Maior de idade');\n}",
                opcoes: [
                    "Falta colocar a condição do if entre parênteses",
                    "A variável idade não pode ser número",
                    "console.log não existe",
                    "O ponto e vírgula está errado"
                ],
                correta: 0,
                tema: "Condicional"
            },
            {
                pergunta: "Por que esse código não funciona?",
                codigo: "let nome = 'Bruno';\n\nconsole.log(nomee);",
                opcoes: [
                    "A variável nomee não existe",
                    "String não pode usar aspas simples",
                    "console.log precisa ficar no HTML",
                    "Faltou criar uma função"
                ],
                correta: 0,
                tema: "Variáveis"
            },
            {
                pergunta: "Qual é o problema nesse laço?",
                codigo: "for (let i = 0; i < 5; i++) {\n    console.log(i)\n",
                opcoes: [
                    "Faltou fechar a chave do for",
                    "O for não pode usar let",
                    "O console.log está errado",
                    "A variável i precisa ser texto"
                ],
                correta: 0,
                tema: "Repetição"
            },
            {
                pergunta: "Qual erro existe nesse fetch?",
                codigo: "fetch('/games/listar')\n.then(function resposta {\n    console.log(resposta);\n});",
                opcoes: [
                    "O parâmetro da função precisa ficar entre parênteses",
                    "fetch só funciona com POST",
                    "then não existe",
                    "console.log não aceita resposta"
                ],
                correta: 0,
                tema: "Fetch"
            },
            {
                pergunta: "Qual é o erro nesse objeto?",
                codigo: "let carro = {\n    nome: 'Skyline'\n    cor: 'azul'\n};",
                opcoes: [
                    "Faltou vírgula entre as propriedades",
                    "Objeto não pode ter texto",
                    "A variável precisa ser const",
                    "A chave final está sobrando"
                ],
                correta: 0,
                tema: "Objeto"
            }
        ];

        let perguntaAtual = 0;
        let pontos = 0;
        let respondeu = false;

        carregarPergunta();

        function carregarPergunta() {
            respondeu = false;

            let perguntaObj = perguntas[perguntaAtual];

            pergunta.innerHTML = perguntaObj.pergunta;
            codigo_debug.innerHTML = perguntaObj.codigo;
            contador_pergunta.innerHTML = "Desafio " + (perguntaAtual + 1) + " de " + perguntas.length;
            tema_pergunta.innerHTML = "Tema: " + perguntaObj.tema;
            pontos_quiz.innerHTML = "Pontos ganhos: " + pontos + " pontos";

            resultado_quiz.classList.add("none");
            btn_proxima.classList.add("none");

            opcoes.innerHTML = "";

            for (let i = 0; i < perguntaObj.opcoes.length; i++) {
                opcoes.innerHTML += `
                    <button class="opcao-btn" onclick="responder(${i})">
                        ${perguntaObj.opcoes[i]}
                    </button>
                `;
            }
        }

        function responder(indice) {
            if (respondeu) return;

            respondeu = true;

            let perguntaObj = perguntas[perguntaAtual];
            let botoesOpcoes = document.querySelectorAll(".opcao-btn");

            if (indice == perguntaObj.correta) {
                pontos += 10;
                botoesOpcoes[indice].classList.add("opcao-correta");

                resultado_quiz.innerHTML = "Debug correto!";
                resultado_quiz.className = "resultado-quiz resultado-correto";
            } else {
                botoesOpcoes[indice].classList.add("opcao-errada");
                botoesOpcoes[perguntaObj.correta].classList.add("opcao-correta");

                resultado_quiz.innerHTML = "Ainda tem bug nesse código!";
                resultado_quiz.className = "resultado-quiz resultado-errado";
            }

            pontos_quiz.innerHTML = "Pontos ganhos: " + pontos + " pontos";
            btn_proxima.classList.remove("none");
        }

        function proximaPergunta() {
            perguntaAtual++;

            if (perguntaAtual < perguntas.length) {
                carregarPergunta();
            } else {
                finalizarOficina();
            }
        }

        function finalizarOficina() {
            let xpGanho = pontos;

            pergunta.innerHTML = "Oficina finalizada!";
            contador_pergunta.innerHTML = "Resultado final";
            pontos_quiz.innerHTML = pontos + " pontos";
            codigo_debug.innerHTML = "";

            opcoes.innerHTML = `
                <div class="quiz-final">
                    <h3>Você ganhou ${xpGanho} XP!</h3>
                    <p>Seu carro recebeu essa pontuação pela oficina de debug.</p>
                    <a href="../games.html" class="btn-jogar">Voltar</a>
                </div>
            `;

            resultado_quiz.classList.add("none");
            btn_proxima.classList.add("none");

            adicionarXP(xpGanho);
        }

        function adicionarXP(xpGanho) {
            fetch("/games/adicionarXP", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    idUsuarioServer: sessionStorage.ID_USUARIO,
                    idGameServer: 3,
                    xpGanhoServer: xpGanho
                })
            })
                .then(function (resposta) {
                    if (resposta.ok) {
                        resposta.json().then(function (json) {
                            sessionStorage.XP_CARRO = json.xp;
                            sessionStorage.NIVEL_CARRO = json.nivel;

                            console.log("XP atualizado:", json);
                        });
                    }
                });
        }
    </script>

</body>

</html>
